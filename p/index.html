<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pixiv工具</title>
	<style type="text/css">
        body{padding:0;margin:0;font-size:20px}
		#tools{position:fixed;left:0;top:0;z-index:1;background-color:#efefef;width:100%;padding:5px 5px 0 5px}
		#tools div{padding-bottom:5px}
		#imgs{margin-top:70px;padding:5px 0 0 5px}
        img{margin-top:15px;background-color:#efefef;}
		img:first-child, img.hidden{margin-top:0}
		.mobile #tools{top:auto;bottom:0}
		.mobile #imgs{margin-top:0;padding-bottom:72px}
		.mobile #imgs img:last-child{margin-bottom:70px;}
	</style>
</head>
<body>
<div id="tools">
	<div id="inputs">
		<label for="pid">PID：</label>
		<input id="pid" type="text" style="width:100px"/>
		<input id="enter" type="button" value="确定"/>
		<label for="count" style="margin-left:10px">图片数：</label><span id="count">0</span>
		<span id="loading" style="display:none;margin-left:15px">...</span>
	</div>
	<div id="bottons">
		<label for="auto">自动：</label><input id="auto" type="button" value="关闭"/>
		<input id="prev" type="button" value="上一张" style="margin-left:105px"/>
		<input id="next" type="button" value="下一张"/>
	</div>
</div>

<div id="imgs"></div>

<script src="index.js" type="application/javascript"></script>
</body>
</html>
