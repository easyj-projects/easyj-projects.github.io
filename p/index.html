<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pixiv工具</title>
	<style type="text/css">
        body{padding:0;margin:0;font-size:20px;background-color:#1e1f22;}
		#tools{position:fixed;left:0;top:0;z-index:1;background-color:#666;width:100%;padding:5px 5px 0 5px}
		#tools div{padding-bottom:5px}
		#tools .ml{margin-left:9px}
		#imgs{margin-top:70px;padding:5px 0 0 5px;padding-bottom:10px}
        img{margin-top:15px;background-color:#999}
		img:first-child, img.hidden{margin-top:0;display:none}

		.mobile #tools{top:auto;bottom:0}
		.mobile #imgs{margin-top:0;padding-bottom:72px}
		.mobile #imgs img:last-child{margin-bottom:70px}

		#configs{position:fixed;left:0;bottom:0;z-index:2;background-color:#666;border:1px solid #aaa;padding:5px;width:100%;display:none}
		#saveConfigPanel{text-align:center}
        .mobile #configs{top:0;bottom:auto}
	</style>
</head>
<body>
<div id="tools">
	<div id="inputs">
		<label for="pid">PID：</label>
		<input id="pid" type="text" style="width:100px"/>
		<input id="enter" type="button" value="确定"/>
		<label for="count" style="margin-left:10px">图片数：</label><span id="count">0</span>
		<span id="loading" style="display:none;margin-left:15px">...</span>
	</div>
	<div id="bottons">
		<input id="auto" type="button" value="手动"/>

		<input id="save" type="button" value="未收藏" class="ml"/>
		<input id="first" type="button" value=" 首 "/>
		<input id="last" type="button" value=" 尾 "/>

		<input id="changeType" type="button" value="仅收藏" class="ml"/>
		<input id="prev" type="button" value="上一张"/>
		<input id="next" type="button" value="下一张"/>

		<input id="openConfigBtn" type="button" value="配置" class="ml"/>
	</div>
</div>

<div id="configs">
	<div id="saveConfigPanel">
		<div>
			<label for="saveConfig">收藏PID列表：</label><br/>
			<textarea id="saveConfig" style="width:95%" rows="10"></textarea>
		</div>

		<input id="closeConfigBtn" type="button" value="取消" />
		<input id="saveConfigBtn" type="button" value="保存" style="margin-left:20px" />
	</div>
</div>

<div id="imgs"></div>

<script src="index.js" type="application/javascript"></script>
</body>
</html>
