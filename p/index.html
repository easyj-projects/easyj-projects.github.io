<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pixiv工具</title>
	<style type="text/css">
        body{padding:0;margin:0;font-size:20px}
		#form{position:fixed;left:0;top:0;z-index:1;background-color:#efefef;width:100%;padding:5px 5px 0 5px}
		#form div{padding-bottom:5px}
		#imgs{margin-top:70px;padding:5px 0 0 5px}
        img{margin-bottom:20px}
		img{background-color:#efefef}
		.mobile #form{top:auto;bottom:0}
		.mobile #bottons{text-align:right;padding-right:20px}
		.mobile #imgs{margin-top:0;padding-bottom:72px}
	</style>
</head>
<body>
<div id="form">
	<div id="inputs">
		<label for="pid">PID：</label>
		<input id="pid" type="text" style="width:100px"/>
		<input id="enter" type="button" value="确定"/>
		<label for="count" style="margin-left:10px">图片数：</label><span id="count">0</span>
		<span id="loading" style="display:none;margin-left:15px">...</span>
	</div>
	<div id="bottons">
		<input id="prev" type="button" value="上一张"/>
		<input id="next" type="button" value="下一张"/>
	</div>
</div>

<div id="imgs">
</div>

<script type="application/javascript">
	const form = document.getElementById("form");
	const pid = document.getElementById("pid");
	const count = document.getElementById("count");
	const loading = document.getElementById("loading");
	const imgs = document.getElementById("imgs");

	const windowWidth = window.innerWidth - 10 < 200 ? 200 : window.innerWidth - 10;

	let curPid = 0;
	let timeout;
	let inFocus = false;

	if (isMobileBrowser()) {
		document.body.classList.add("mobile");
		form.style.width = windowWidth + "px";
	}

	// 监听回车键
	pid.addEventListener('keypress', function (e) {
		clearPid();

		if (pid.value === '') {
			return;
		}

		if (e.key === 'Enter') {
			enter();
		}
	});
	// 监听获取焦点
	pid.addEventListener('focus', function () {
		clearPid();
		inFocus = true;
		pid.selectionStart = pid.selectionEnd = pid.value.length; // 光标移到最后面
	});
	// 监听失去焦点
	pid.addEventListener('blur', function () {
		clearPid();
		inFocus = false;
	});

	// 初始化
	if (localStorage.getItem('pid')) {
		pid.value = localStorage.getItem('pid');
		enter();
	} else {
		clearPid();
		if (pid.value === '') {
			pid.value = '116000000';
		}
	}

	pid.focus(); // 自动获取焦点

	// 监听全局键盘左右键
	window.addEventListener('keyup', function (e) {
		if (inFocus) {
			return;
		}

		// 按F2获取输入框焦点
		if (e.key === 'F2') {
			pid.focus();
			return;
		}

		// 监听左右键
		clearPid();
		if (pid.value === '') {
			return;
		}
		if (e.key === 'ArrowLeft') {
			pid.value = pid.value - 1;
			enter();
		}
		if (e.key === 'ArrowRight') {
			pid.value = pid.value - 0 + 1;
			enter();
		}
	});
	// 确定
	document.getElementById("enter").onclick = enter;
	// 上一张
	document.getElementById("prev").onclick = function () {
		if (pid.value === '') {
			pid.focus();
			return;
		}
		pid.value = pid.value - 1;
		enter();
	};
	// 下一张
	document.getElementById("next").onclick = function () {
		if (pid.value === '') {
			pid.focus();
			return;
		}
		pid.value = pid.value - 0 + 1;
		enter();
	};

	function clearPid () {
		if (pid.value !== '') {
			pid.value = pid.value.replace(/[^0-9]/g, '');
		}
	}

	function reduceImg (img) {
		if (isMobileBrowser()) {
			// 宽度超过页面时，缩小显示
			if (img.width > windowWidth) {
				img.style.width = windowWidth + "px";
				img.style.height = "auto";
				return true;
			}
		}
	}

	function createImage (id, n) {
		if (id !== curPid) {
			return;
		}
		if (!(id > 0)) {
			return;
		}

		let interval;

		const img = document.createElement("img");
		if (n > 1) {
			img.src = `https://pixiv.nl/${id}-${n}.jpg`;
		} else {
			img.src = `https://pixiv.nl/${id}.jpg`;
		}
		img.title = `${id}-${n}`;
		img.alt = img.title;
		img.style.height = "400px";
		img.style.cursor = 'pointer';
		img.style.display = 'block';
		img.onclick = function () {
			window.open(img.src);
		};
		img.onload = function () {
			clearInterval(interval);
			if (id !== curPid) {
				return;
			}

			img.title += `  ${img.naturalWidth}✖️${img.naturalHeight}`;

			reduceImg(); // 如果图片太宽，则缩小图片

			count.innerHTML = n;
			createImage(id, n + 1);
		};
		img.onerror = function () {
			clearInterval(interval);
			if (id !== curPid) {
				return;
			}
			loading.style.display = 'none';
			if (n > 1) {
				imgs.removeChild(img);
			} else {
				imgs.innerHTML = '<h1>404 Not Found</h1><span>这个作品可能已被删除，或无法取得。</span>';
			}
		};

		if (isMobileBrowser()) {
			interval = setInterval(function () {
				if (reduceImg(img)) {
					clearInterval(interval);
				}
			}, 10);
		}

		imgs.appendChild(img);
	}

	function enter () {
		clearPid();

		if (pid.value === '') {
			return;
		}

		clearTimeout(timeout);

		// 清空图片
		imgs.childNodes.forEach(function (img) {
			if (img && img.src) {
				img.src = '';
				img.style.height = 'auto';
				img.style.width = windowWidth + "px";
			}
		});
		if (imgs.innerHTML && !imgs.innerHTML.includes("<img ")) {
			imgs.innerHTML = '';
		}

		// 设置参数
		curPid = 0;

		// 初始化参数
		count.innerHTML = "0"; // 重置图片数

		timeout = setTimeout(function () {
			const id = pid.value - 0;
			if (id > 999999999) {
				imgs.innerHTML = 'PID不能超过9位';
				return;
			} else if (id < 10) {
				imgs.innerHTML = 'PID不能小于10';
				return;
			}
			localStorage.setItem('pid', pid.value);
			curPid = id;
			imgs.innerHTML = ''; // 清空图片
			loading.style.display = 'inline-block'; // 显示loading
			createImage(id, 1);
		}, 400);
	}

	function isMobileBrowser () {
		return window.innerWidth <= 500 || /Mobile|Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
	}
</script>
</body>
</html>
