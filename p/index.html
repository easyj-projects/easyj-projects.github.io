<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pixiv工具</title>
	<style type="text/css">
        div {margin-bottom:5px}
        img {margin-bottom:20px}
	</style>
</head>
<body>
<div>
	<label for="pid">PID：</label>
	<input id="pid" type="text"/>
	<input id="enter" type="button" value="确定"/>

	<label for="count" style="margin-left:20px">图片数：</label>
	<span id="count">0</span>
</div>
<div>
	<input id="prev" type="button" value="上一张"/>
	<input id="next" type="button" value="下一张"/>
</div>
<div id="loading" style="display:none">loading...</div>
<div id="imgs"></div>

<script type="application/javascript">
	const pid = document.getElementById("pid");
	const count = document.getElementById("count");
	const loading = document.getElementById("loading");
	const imgs = document.getElementById("imgs");

	let curPid = 0;

	// 监听回车键
	pid.addEventListener('keypress', function (e) {
		clearPid();

		if (pid.value === '') {
			return;
		}

		pid.focus(); // 自动获取焦点
		pid.selectionStart = pid.selectionEnd = pid.value.length; // 光标移到最后面

		if (e.key === 'Enter') {
			enter();
		}
	});

	if (location.hash) {
		pid.value = location.hash.substring(1);
		clearPid();
	}

	if (pid.value === '') {
		pid.value = localStorage.getItem('pid') || '116000000';
	}

	enter();

	pid.focus(); // 自动获取焦点
	pid.selectionStart = pid.selectionEnd = pid.value.length; // 光标移到最后面

	// 监听全局键盘左右键
	window.addEventListener('keyup', function (e) {
		if (pid.value === '') {
			pid.focus();
			pid.selectionStart = pid.selectionEnd = pid.value.length;
			return;
		}

		if (e.key === 'ArrowLeft') {
			pid.value = pid.value - 1;
			enter();
		}
		if (e.key === 'ArrowRight') {
			pid.value = pid.value - 0 + 1;
			enter();
		}

		pid.focus();
		pid.selectionStart = pid.selectionEnd = pid.value.length;
	});
	// 确定
	document.getElementById("enter").onclick = enter;
	// 上一张
	document.getElementById("prev").onclick = function () {
		if (pid.value === '') {
			pid.focus();
			pid.selectionStart = pid.selectionEnd = pid.value.length;
			return;
		}
		pid.value = pid.value - 1;
		enter();
	};
	// 下一张
	document.getElementById("next").onclick = function () {
		if (pid.value === '') {
			pid.focus();
			pid.selectionStart = pid.selectionEnd = pid.value.length;
			return;
		}
		pid.value = pid.value - 0 + 1;
		enter();
	};

	function clearPid () {
		if (pid.value !== '') {
			pid.value = pid.value.replace(/[^0-9]/g, '');
		}
		pid.focus();
		pid.selectionStart = pid.selectionEnd = pid.value.length;
	}

	function createImage (id, n) {
		if (id !== curPid) {
			return;
		}

		if (!(id > 0)) {
			return;
		}

		const img = document.createElement("img");
		if (n > 1) {
			img.src = `https://pixiv.nl/${id}-${n}.jpg`;
		} else {
			img.src = `https://pixiv.nl/${id}.jpg`;
		}
		img.title = `${id}-${n}`;
		img.height = 400;
		img.style.cursor = 'pointer';
		img.style.display = 'block';
		img.onclick = function () {
			window.open(img.src);
		};
		img.onload = function () {
			if (id !== curPid) {
				return;
			}

			img.title += `  ${img.naturalWidth}✖️${img.naturalHeight}`;

			count.innerHTML = n;
			createImage(id, n + 1);
		};
		img.onerror = function () {
			if (id !== curPid) {
				return;
			}
			loading.style.display = 'none';
			if (n > 1) {
				imgs.removeChild(img);
			} else {
				imgs.innerHTML = '图片不存在';
			}
		};
		imgs.appendChild(img);
	}

	function enter () {
		if (pid.value === '') {
			return;
		}

		// 设置参数
		location.hash = pid.value;
		localStorage.setItem('pid', pid.value);
		curPid = pid.value - 0;

		// 初始化参数
		count.innerHTML = 0; // 重置图片数
		imgs.innerHTML = ''; // 清空图片

		// 显示loading
		loading.style.display = 'block';

		setTimeout(function () {
			createImage(pid.value - 0, 1);
		}, 100);
	}
</script>
</body>
</html>
